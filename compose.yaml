name: ${COMPOSE_PROJECT_NAME:-archflow}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      ARCHFLOW_UPLOAD_DIR: /data/uploads
      ARCHFLOW_PROJECT_DIR: /data/projects
      ARCHFLOW_CASE_UPLOAD_DIR: /data/cases
      ARCHFLOW_DATABASE_PATH: /data/archflow.sqlite3
      ARCHFLOW_REPOSITORY_ROOT: /app
      ARCHFLOW_ALLOWED_ORIGINS: ${ARCHFLOW_ALLOWED_ORIGINS:-http://localhost:8080}
      ARCHFLOW_GITHUB_REPOSITORY: ${ARCHFLOW_GITHUB_REPOSITORY:-jingwenadc/archflow}
      ARCHFLOW_GITHUB_BASE_BRANCH: ${ARCHFLOW_GITHUB_BASE_BRANCH:-main}
      ARCHFLOW_GITHUB_TOKEN: ${ARCHFLOW_GITHUB_TOKEN:-}
      ARCHFLOW_AGENT_ENABLED: ${ARCHFLOW_AGENT_ENABLED:-false}
      ARCHFLOW_WORKER_TOKEN: ${ARCHFLOW_WORKER_TOKEN:-}
      ARCHFLOW_LLM_MODEL: ${ARCHFLOW_LLM_MODEL:-gpt-5.5}
      ARCHFLOW_REVIEW_MODEL: ${ARCHFLOW_REVIEW_MODEL:-gpt-5.5}
    volumes:
      - ${ARCHFLOW_DATA_DIR:-./.local/deployment-data}:/data
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    environment:
      ARCHFLOW_AGENT_ENABLED: ${ARCHFLOW_AGENT_ENABLED:-false}
      ARCHFLOW_API_URL: http://api:8000
      ARCHFLOW_WORKER_TOKEN: ${ARCHFLOW_WORKER_TOKEN:-}
      ARCHFLOW_LLM_BASE_URL: ${ARCHFLOW_LLM_BASE_URL:-}
      ARCHFLOW_LLM_API_KEY: ${ARCHFLOW_LLM_API_KEY:-}
      ARCHFLOW_LLM_CONTEXT_WINDOW: ${ARCHFLOW_LLM_CONTEXT_WINDOW:-32768}
      ARCHFLOW_LLM_MAX_OUTPUT_TOKENS: ${ARCHFLOW_LLM_MAX_OUTPUT_TOKENS:-8192}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 512m

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  nginx:
    image: nginx:1.28-alpine
    environment:
      ARCHFLOW_DOMAIN: ${ARCHFLOW_DOMAIN:-localhost}
      NGINX_ENVSUBST_FILTER: ^ARCHFLOW_DOMAIN$
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80
    volumes:
      - ./deploy/nginx/http.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/nginx/05-load-basic-auth.sh:/docker-entrypoint.d/05-load-basic-auth.sh:ro
      - ./deploy/nginx/.htpasswd:/run/secrets/archflow.htpasswd:ro
      - ${ACME_WEBROOT_DIR:-./.local/certbot/www}:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s
    logging: *default-logging
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m,mode=0755
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=8m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
