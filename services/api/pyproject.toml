[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "archflow-api"
version = "0.1.0"
description = "ArchFlow review API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.35,<1",
  "pypdf>=6,<7",
  "pillow>=11,<13",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/archflow_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
